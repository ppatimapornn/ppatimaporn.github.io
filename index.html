
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatuchak 3D City</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #title {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: #1e293b;
            padding: 15px 20px;
            border-radius: 10px;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="title">
        <h2>CHATUCHAK 3D CITY</h2>
        <p>3D City Model Prototype</p>
    </div>

    <script type="module" src="%BASE_URL%main.js"></script>
<div id="buildingInfo" style="
  display: none;
  position: fixed;
  top: 20px;
  right: 20px;
  width: 260px;
  padding: 16px;
  background: white;
  color: #222;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  font-family: Arial, sans-serif;
  z-index: 1000;
">
  <button id="closeBuildingInfo" style="
    float: right;
    border: none;
    background: #eee;
    padding: 5px 9px;
    border-radius: 5px;
    cursor: pointer;
  ">ปิด</button>

  <h3>ข้อมูลอาคาร</h3>
  <p id="buildingName"></p>
  <p id="buildingType"></p>
  <p id="buildingLevels"></p>
  <p id="buildingHeight"></p>
</div>
</body>
</html>
